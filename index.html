<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DevKit · 开发者工具箱</title>
  <meta name="description" content="日常开发常用工具集合：JSON 格式化、Base64、加密、时间戳、二维码等" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://cdnjs.cloudflare.com https://cdn.jsdelivr.net; script-src-attr 'none'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; object-src 'none'; base-uri 'none'; form-action 'none'; connect-src 'none'" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ctext y='26' font-size='28'%3E🧰%3C/text%3E%3C/svg%3E" />
  <link rel="stylesheet" href="styles.css" />
  <!-- CDN 库 -->
  <script defer src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.2.0/crypto-js.min.js"
    integrity="sha384-mgWScxWVKP8F7PBbpNp7i/aSb17kN0LcifBpahAplF3Mn0GR4/u1oMpWIm2rD8yY" crossorigin="anonymous"></script>
  <script defer src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"
    integrity="sha384-3zSEDfvllQohrq0PHL1fOXJuC/jSOO34H46t6UQfobFOmxE5BpjjaIJY5F2/bMnU" crossorigin="anonymous"></script>
  <script defer src="https://cdnjs.cloudflare.com/ajax/libs/js-yaml/4.1.0/js-yaml.min.js"
    integrity="sha384-+pxiN6T7yvpryuJmE1gM9PX7yQit15auDb+ZwwvJOd/4be2Cie5/IuVXgQb/S9du" crossorigin="anonymous"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js"
    integrity="sha384-b5Ya4Bq3qCyz39m2ISh+4DxjAIljdeFwK/BsXLuj9gugaNwAcj/ia15fxNZL9Nlx" crossorigin="anonymous"></script>
  <script defer src="postcode-data.js"></script>
  <script defer src="js/registry.js"></script>
  <script defer src="js/tools/format.js"></script>
  <script defer src="js/tools/encoding.js"></script>
  <script defer src="js/tools/crypto.js"></script>
  <script defer src="js/tools/datetime.js"></script>
  <script defer src="js/tools/identity.js"></script>
  <script defer src="js/tools/misc.js"></script>
  <script defer src="js/app.js"></script>
</head>
<body>
  <div class="app">
    <!-- Logo 区 -->
    <div class="logo-area">
      <div class="logo-mark">D</div>
      <span>DevKit</span>
    </div>

    <!-- 顶栏 -->
    <header class="header">
      <button class="icon-btn" id="menuBtn" title="菜单" style="display:none;">📋</button>
      <div class="search-box">
        <input type="text" id="searchInput" placeholder="搜索工具（如 JSON、Base64、MD5）..." autocomplete="off" />
      </div>
      <div class="header-actions">
        <select class="lang-select" id="langBtn" title="Language / 语言">
          <option value="zh">中文</option>
          <option value="en">English</option>
        </select>
        <button class="icon-btn" id="themeBtn" title="切换主题">🌙</button>
        <a class="icon-btn" href="#home" title="首页" style="text-decoration:none;">🏠</a>
      </div>
    </header>

    <!-- 侧边栏 -->
    <aside class="sidebar" id="sidebar"></aside>

    <!-- 主区 -->
    <main class="main" id="main"></main>
  </div>

  <div class="toast" id="toast"></div>

</body>
</html>
